name: Deploy site to GitHub Pages

# Human Gate history (per docs/next-actions.md and the Workshop Gremlin's own
# policy): the first Pages deploy was a human-confirmed, workflow_dispatch-only
# action, not automatic - see .hekton/project.yaml's deployment block for the
# full record (agentic-infra-lab PR #15, wade-in PRs #16-18). That gate is now
# satisfied: Pages is enabled (source = GitHub Actions), the custom domain
# wade-in.coderturtle.io is set, DNS resolves and is verified, and the first
# real deploy (2026-09-16, run 35146803274) confirmed the site live. The
# `push` trigger below was added at that point, not before.
#
# Custom domain: wade-in.coderturtle.io, via agentic-infra-lab's
# github-pages-dns pattern (Route53 CNAME + TXT verification). Do NOT rely on
# site/public/CNAME alone for an Actions-based deploy to (re-)set the custom
# domain - a lesson copilot-fluent's own workflow comment carries forward,
# corrected there after cross-model review. Pages enablement and the
# custom-domain setting are one-time, human-authenticated-session steps in
# repo Settings > Pages (GITHUB_TOKEN cannot do either); already done.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/build-log/**"
      - "modules/**"
      - ".github/workflows/deploy-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: site

      # Blocking, unlike the local pre-push hook's warn-only check (setup-
      # hooks.sh) - a bad deploy is worse than a local warning ignored.
      - name: Brand lint (blocking)
        run: bash scripts/check-brand-lint.sh --check

      - name: Build site
        run: npm run build
        working-directory: site

      # Custom domain: wade-in.coderturtle.io, via agentic-infra-lab's
      # github-pages-dns pattern (Route53 CNAME + TXT verification). Pages
      # enablement and the custom-domain setting are one-time, human-run
      # steps in repo Settings > Pages (GITHUB_TOKEN cannot do either) - do
      # not rely on site/public/CNAME alone for an Actions-based deploy, see
      # the note above this job.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
